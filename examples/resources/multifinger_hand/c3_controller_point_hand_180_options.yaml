state_prediction_joints: []

quaternion_indices: [9]
Q_quaternion_weight: 3000

quaternion_regularizer_fraction: 0.0

x_init: [0, 0.07, 0.05,  # finger 1  
         0.07, -0.06, 0.05,   # finger 2
         -0.07, -0.06, 0.05,   # finger 3
         1, 0, 0, 0,  # cube orientation
         0, 0, 0.05,  # cube position
         0, 0, 0,     # finger 1 velo
         0, 0, 0,     # finger 2 velo
         0, 0, 0,     # finger 3 velo
         0, 0, 0,     # cube ang velo
         0, 0, 0]   	# cube velo


x_des: [0, 0.06, 0.05,  # finger 1  
         0.06, -0.06, 0.05,   # finger 2
         -0.06, -0.06, 0.05,   # finger 3
         0, 0, 0, 1,  # cube orientation (180 about z)
         0, 0, 0.05,  # cube position
         0, 0, 0,     # finger 1 velo
         0, 0, 0,     # finger 2 velo
         0, 0, 0,     # finger 3 velo
         # 0, 0, 0,     # finger 4 velo
         0, 0, 0,     # cube ang velo
         0, 0, 0]     # cube velo

        
