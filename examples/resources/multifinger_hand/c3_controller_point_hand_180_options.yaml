projection_type: "C3+"

solve_time_filter_alpha: 0.0
#set to 0 to publish as fast as possible
publish_frequency: 0
state_prediction_joints: []

quaternion_indices: [9]
Q_quaternion_weight: 100

quaternion_regularizer_fraction: 0.0

x_init: [0, 0.08, 0.05,  # finger 1  
         0.08, -0.07, 0.05,   # finger 2
         -0.08, -0.07, 0.05,   # finger 3
         1, 0, 0, 0,  # cube orientation
         0, 0, 0.051,  # cube position
         0, 0, 0,     # finger 1 velo
         0, 0, 0,     # finger 2 velo
         0, 0, 0,     # finger 3 velo
         0, 0, 0,     # cube ang velo
         0, 0, 0]   	# cube velo


x_des: [0, 0.09, 0.05,  # finger 1  
         0.08, -0.08, 0.05,   # finger 2
         -0.08, -0.08, 0.05,   # finger 3
         0, 0, 0, 1,  # cube orientation (180 about z)
         0, 0, 0.051,  # cube position
         0, 0, 0,     # finger 1 velo
         0, 0, 0,     # finger 2 velo
         0, 0, 0,     # finger 3 velo
         0, 0, 0,     # cube ang velo
         0, 0, 0]     # cube velo

        
lcs_factory_options:
  #options are 'stewart_and_trinkle' or 'anitescu'
  # contact_model : 'stewart_and_trinkle'
  contact_model: "anitescu"
  num_friction_directions: 2
  num_contacts: 14
  spring_stiffness: 0

  # 3 fingertip-cube, 3 fingertip-ground, 8 cube-ground
  mu: [0.6, 0.6, 0.6, 0.6, 0.6, 0.6, 0.6, 0.6, 0.6, 0.6, 0.6, 0.6, 0.6, 0.6] #, 0.8, 0.8]
  N: 200
  dt: 0.02

c3_options:
  penalize_input_change: false # Currently combines u-u_prev and u-u_des

  # EXPERIMENTAL
  # penalize_snap: false
  # snap_scaling: 1 # If too big, can cause non-convexity

  warm_start: true
  end_on_qp_step: true
  scale_lcs: true

  num_threads: 10
  delta_option: 1

  M: 1000

  admm_iter: 7
  gamma: 1.0
  rho_scale: 1.1 #matrix scaling
  w_Q: 5
  w_R: 200 #Penalty on all decision variables, assuming scalar
  w_G: 20 #Penalty on all decision variables, assuming scalar
  w_U: 5 #State Tracking Error, assuming diagonal

