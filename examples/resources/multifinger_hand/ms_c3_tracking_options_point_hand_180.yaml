  # contact_model : 'stewart_and_trinkle'
  contact_model: "anitescu"
  num_friction_directions: 2
  num_contacts: 7
  spring_stiffness: 0

  # 3 fingertip-cube, 4 cube-ground
  mu: [0.5, 0.5, 0.5, 0.5, 0.5, 0.5, 0.5]
  N: 7
  dt: 0.02

c3_options:
  penalize_input_change: false # Currently combines u-u_prev and u-u_des
  input_change_weight: 1000 # ratio of u-u_prev weight to u-u_des weight

  penalize_x_change: false # Currently combines x-x_prev and x-x_des
  x_change_weight: 1000 # ratio of x-x_prev weight to x-x_des weight

