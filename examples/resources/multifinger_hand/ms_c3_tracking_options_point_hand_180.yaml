  g_eta_t: [2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2] 
  g_eta: [2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2] 
  g_u: [45, 45, 45, 45, 45, 45, 45, 45, 45] 



  u_x: [50, 50, 50, 50, 50, 50, 50, 50, 50,   # hand pos
        50, 50, 50, 50, 50, 50, 50,                       # cube pos
        10, 10, 10, 10, 10, 10, 10, 10, 10,   # hand velo
        1, 1, 1, 1, 1, 1]                           # cube velo

  u_lambda: [93, 93, 93, 93, 93, 93, 93, 93, 93, 93, 93, 93, 93, 93, 93, 93, 93, 93, 93, 93, 93, 93, 93, 93, 93, 93, 93, 93] 
