  contact_model: "anitescu"
  num_friction_directions: 2
  num_contacts: 7
  spring_stiffness: 0

  # 3 fingertip-cube, 4 cube-ground
  mu: [0.33, 0.33, 0.33, 0.3, 0.3, 0.3, 0.3]
  N: 3
  dt: 0.02

c3_options:
  penalize_input_change: true  # Currently combines u-u_prev and u-u_des
  input_change_weight: 4.69 # ratio of u-u_prev weight to u-u_des weight

  penalize_x_change: true  # Currently combines x-x_prev and x-x_des
