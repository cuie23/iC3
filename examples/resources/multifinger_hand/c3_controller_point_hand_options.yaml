projection_type: "C3+"

solve_time_filter_alpha: 0.0
#set to 0 to publish as fast as possible
publish_frequency: 100
state_prediction_joints: []

quaternion_indices: [12]
Q_quaternion_weight: 5000

quaternion_regularizer_fraction: 0.0

x_init: [0, 0, -0.0,     # index
         0, 0, 0.0,     # middle
         0, 0, 0.0,     # ring   
         0, 0, 0.0,     # thumb
         1, 0, 0, 0,  # cube orientation
         0, 0, 0.05,  # cube position
         0, 0, 0,     # index velo
         0, 0, 0,     # middle velo
         0, 0, 0,     # ring velo
         0, 0, 0,     # thumb velo
         0, 0, 0,     # cube ang velo
         0, 0, 0]   	# cube velo


x_des: [0, 0, 0.0,      # index
         0, 0, 0.0,     # middle
         0, 0, 0.0,     # ring   
         0, 0, 0.0,     # thumb
         # 0, 0, 1, 0,  # cube orientation (180 about y)
         0.707, 0, 0.707, 0,  # cube orientation (90 about y)
         #0, 0, 0, 1,  # cube orientation (180 about z)
         0, 0, 0,  # cube position
         0, 0, 0,     # index velo
         0, 0, 0,     # middle velo
         0, 0, 0,     # ring velo
         0, 0, 0,     # thumb velo
         0, 0, 0,     # cube ang velo
         0, 0, 0]     # cube velo

        
lcs_factory_options:
  #options are 'stewart_and_trinkle' or 'anitescu'
  # contact_model : 'stewart_and_trinkle'
  contact_model: "anitescu"
  num_friction_directions: 2
  num_contacts: 16
  spring_stiffness: 0
  mu: [0.8, 0.8, 0.8, 0.8, 0.8, 0.8, 0.8, 0.8, 0.8, 0.8, 0.8, 0.8, 0.8, 0.8, 0.8, 0.8]
  N: 120    
  dt: 0.01

c3_options:
  penalize_input_change: false # Currently combines u-u_prev and u-u_des

  # EXPERIMENTAL
  # penalize_snap: false
  # snap_scaling: 0.5 # If too big, can cause non-convexity

  warm_start: false
  end_on_qp_step: true
  scale_lcs: false

  num_threads: 10
  delta_option: 1

  M: 1000

  admm_iter: 8
  gamma: 1.03
  rho_scale: 1.1 #matrix scaling
  w_Q: 5
  w_R: 10 #Penalty on all decision variables, assuming scalar
  w_G: 150 #Penalty on all decision variables, assuming scalar
  w_U: 0.4 #State Tracking Error, assuming diagonal

  q_vector: [500, 500, 50,    # index
             500, 500, 50,    # middle
             500, 500, 50,    # ring   
             500, 500, 50,    # thumb 
             1, 1, 1, 1,
             500, 500, 50,
             1, 1, 1,          # index velo
             1, 1, 1,          # middle velo
             1, 1, 1,          # ring velo 
             1, 1, 1,          # thumb velo
