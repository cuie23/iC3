lcs_factory_options:
  #options are 'stewart_and_trinkle' or 'anitescu'
  # contact_model : 'stewart_and_trinkle'
  contact_model: "anitescu"
  num_friction_directions: 2
  num_contacts: 11
  spring_stiffness: 0
  mu: [0.7, 0.7, 0.7, 0.3, 0.3, 0.3, 0.3, 0.3, 0.3, 0.3, 0.3]
  N: 5
  dt: 0.03

# Contact resolution options:
# Contact pairs include:
#   1. fingertip-cube (3 contact pairs)
#   2. cube-ground (8 contact pairs for 3D pivot, 4 contact pairs for 180)
mu_per_pair_type: [0.7, 0.3]
resolve_contacts_to_lists: [[3, 8]]
num_contacts_index: 0



